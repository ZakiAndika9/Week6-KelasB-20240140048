<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DikelKart - Temukan Produk Favoritmu</title>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="nav">
    <a class="brand" href="index.html"><svg class="brand-logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="10" fill="currentColor"/><path d="M9 10h2.5l2 10h10l2-7H12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15" cy="24" r="1.5" fill="#fff"/><circle cx="22" cy="24" r="1.5" fill="#fff"/></svg><span>DikelKart</span></a>
    <div class="nav-links">
      <a href="index.html" aria-current="page">Produk</a>
      <a href="form.html">Member</a>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Ganti mode tampilan" title="Ganti mode tampilan">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </nav>

  <header class="hero hero--home">
    <p class="eyebrow">Gadget, gaya, dan aktivitasmu</p>
    <h1>Temukan gear baru<br>untuk setiap harimu.</h1>
    <p class="lead">Jelajahi smartphone, laptop, fashion, dan perlengkapan olahraga pilihan di DikelKart.</p>
    <div class="hero-actions">
      <a class="hero-button" href="#productGrid">Jelajahi produk <span aria-hidden="true">→</span></a>
      <a class="hero-link" href="form.html">Kenali keuntungan member</a>
    </div>
  </header>

  <section class="toolbar">
    <label for="searchInput" class="sr-only">Cari produk</label>
    <input type="search" id="searchInput" placeholder="Cari gadget, fashion, atau perlengkapan olahraga..." disabled>
    <span id="resultCount" class="count" aria-live="polite"></span>
  </section>

  <main>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div id="productGrid" class="grid"></div>
  </main>

  <footer class="footer">
    &copy; 2026 DikelKart &middot; Pilihan seru, belanja lebih mudah
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
